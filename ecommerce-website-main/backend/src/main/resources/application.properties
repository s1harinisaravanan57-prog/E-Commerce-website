spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/little_nest?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
