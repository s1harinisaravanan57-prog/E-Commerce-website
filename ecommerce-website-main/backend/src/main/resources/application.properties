spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
server.port=${SERVER_PORT:8080}
wix.frontend.origin=${FRONTEND_ORIGIN:http://localhost:3000}
owner.notification.enabled=${OWNER_NOTIFICATION_ENABLED:false}
owner.notification.email=${OWNER_NOTIFICATION_EMAIL:s1harinisaravanan@gmail.com}
